services:
  meme-web:
    image: meme-web:latest
    pull_policy: never
    ports:
      - "${MEME_WEB_PORT:-2233}:2233"
    environment:
      LANG: en_US.UTF-8
      MALLOC_ARENA_MAX: "2"
    volumes:
      - meme-web-config:/root/.config/meme_generator
    restart: unless-stopped

volumes:
  meme-web-config:
