<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meme Generator - 表情包生成器</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="header">
  <div class="header-inner">
    <h1 class="logo">Meme Generator</h1>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="搜索表情包..." autocomplete="off">
      <button class="clear-search" id="clear-search" type="button" aria-label="清除搜索" hidden>&times;</button>
    </div>
    <div class="header-stats">
      <span id="meme-count">0</span> 个表情
    </div>
    <a class="github-link header-github" href="https://github.com/wangwuli-AAA/meme_generator_web" target="_blank" rel="noopener noreferrer">GitHub</a>
    <button class="btn-logout" id="btn-logout" type="button">退出</button>
  </div>
</header>

<div class="main-layout">
  <main class="content">
    <div class="workspace-layout">
      <section class="meme-grid-section" aria-label="表情包列表">
        <div class="meme-grid" id="meme-grid"></div>
        <div class="pagination" id="pagination"></div>
        <div class="loading" id="loading" style="display:none" role="status" aria-live="polite">
          <div class="spinner"></div>
          <span>加载中...</span>
        </div>
      </section>

      <section class="meme-form-section is-empty" id="meme-form-section" aria-label="表情包编辑器">
      <div class="editor-empty-state" id="editor-empty-state" role="status">
        <div class="editor-empty-icon" aria-hidden="true">✦</div>
        <strong>请选择一个表情包</strong>
        <span>从左侧选择模板后，在这里编辑文字、上传图片并生成。</span>
      </div>
      <div class="form-header">
        <h2 id="form-title">选择一个表情包</h2>
        <button class="btn-close" id="form-close" aria-label="关闭">&times;</button>
      </div>
      <div class="form-body">
        <div class="form-group" id="image-group" style="display:none">
          <label>上传图片 (<span id="image-count"></span>)</label>
          <div class="image-upload-area" id="image-upload-area"></div>
        </div>
        <div class="form-group" id="text-group" style="display:none">
          <label>文字 (<span id="text-count"></span>)</label>
          <div id="text-inputs"></div>
        </div>
        <div class="form-group" id="args-group" style="display:none">
          <label>参数</label>
          <div id="args-inputs"></div>
        </div>
        <div class="form-actions">
          <button class="btn btn-preview" id="btn-preview">预览</button>
          <button class="btn btn-generate" id="btn-generate">生成</button>
          <button class="btn btn-download" id="btn-download" disabled>下载</button>
        </div>
        <div class="generation-status" id="generation-status" role="status" aria-live="polite"></div>
      </div>
      <div class="result-area" id="result-area" style="display:none">
        <img id="result-image" alt="生成结果">
      </div>
      </section>
    </div>
  </main>
</div>

<!-- Toast notifications -->
<div class="toast-container" id="toast-container"></div>

<script src="/static/js/utils.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/browser.js"></script>
<script src="/static/js/form.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
