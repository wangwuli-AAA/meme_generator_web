<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - Meme Generator</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
<main class="login-shell">
  <section class="login-panel" aria-labelledby="login-title">
    <div class="login-brand">Meme Generator</div>
    <h1 id="login-title">登录</h1>
    <p class="login-subtitle">登录后继续使用表情包生成器</p>
    <form id="login-form" novalidate>
      <label for="username">账号</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="login-submit" type="submit">登录</button>
      <p id="login-error" class="login-error" role="alert" hidden></p>
    </form>
  </section>
</main>
<script src="/static/js/login.js"></script>
</body>
</html>
